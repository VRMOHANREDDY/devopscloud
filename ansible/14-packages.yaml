- name: Install and unInstall packages
  hosts: frontend
  become: yes
  tasks:
  - name: Install and uninstall packages
    package:
      name: {{item.name}}
      state: {{item.state}}
    loop:
    - {name: "nginx", state: "present"}
    - {name: "mysql", state: "absent"}
    - {name: "zip", state: "present"}