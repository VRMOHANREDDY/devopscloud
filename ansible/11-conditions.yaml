- name: conditions
  hosts: local
  connection: local
  vars:
    given_number: 7
  tasks:
  - name: check give number is even
    debug:
      msg: "{{given_number}} is even"
    when: given_number % 2 == 0
  - name: check given number is odd
    debug:
      msg: "{{given_number} is odd}"
    when: given_number % 2 != 0